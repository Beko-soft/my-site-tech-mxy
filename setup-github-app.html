<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenLearn · GitHub App Kurulumu</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" style="max-width: 620px">
      <section class="panel" style="padding: 28px; margin-top: 72px">
        <div class="section-head">
          <div>
            <h2>GitHub App Kurulumu</h2>
            <p class="muted" id="status">GitHub'a yönlendiriliyorsunuz...</p>
          </div>
        </div>
        <p class="muted small">
          GitHub sayfasında ayarlar otomatik dolu gelecek. Sayfanın altındaki
          <strong>Create GitHub App</strong> butonuna tıkla, sonra App sayfasındaki
          <strong>Client ID</strong>'yi kopyala.
        </p>
      </section>
    </main>

    <script>
      setTimeout(function () {
        location.replace(
          "https://github.com/settings/apps/new?name=OpenLearn-MXY&description=OpenLearn%20GitHub%20entegrasyonu&url=https%3A%2F%2Fmxydev.com%2F&callback_urls[]=https%3A%2F%2Fmxydev.com%2Foauth-callback.html&public=true&contents=write&metadata=read&webhook_active=false&webhook_url=https%3A%2F%2Fmxydev.com%2F&redirect_on_update=false"
        );
      }, 900);
    </script>
  </body>
</html>
