<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenLearn</title>
    <meta
      name="description"
      content="GitHub depolu, sunucusuz interaktif kurs oluşturma ve keşif platformu."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#/">
          <span class="brand-mark">OL</span>
          <span>OpenLearn</span>
        </a>
        <nav class="nav" aria-label="Ana menü">
          <a href="#/" data-route-link="home">Keşfet</a>
          <a href="#/studio" data-route-link="studio">Studio</a>
          <button class="icon-button" id="themeToggle" type="button" aria-label="Tema değiştir" title="Tema">
            ◐
          </button>
          <button class="button ghost" id="authButton" type="button">GitHub ile giriş</button>
        </nav>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

    <template id="courseCardTemplate">
      <article class="course-card">
        <div class="course-card-banner">
          <span class="course-logo"></span>
        </div>
        <div class="course-card-body">
          <div class="meta-row">
            <span class="pill"></span>
            <span class="muted small"></span>
          </div>
          <h3></h3>
          <p></p>
        </div>
        <div class="course-card-foot">
          <span class="lesson-count"></span>
          <a class="button small" href="#">Aç</a>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
